<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Almanya'ya Taşınma Kontrol Listesi | İlk Günler ve İlk Ay</title><meta name="description" content="Almanya'ya taşınırken Anmeldung, banka hesabı, sağlık sigortası, telefon-internet, vergi kimliği ve diğer işlemleri interaktif kontrol listesiyle takip edin."><link rel="canonical" href="https://almanyapusulasi.de/almanyaya-tasinma-kontrol-listesi/"><meta name="google-adsense-account" content="ca-pub-6014752203462020"><link rel="stylesheet" href="/assets/style.css"><link rel="icon" href="/favicon.ico"><script defer src="/assets/js/analytics-consent.js"></script><style>.checklist{max-width:760px;margin:auto}.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #e4e8ee}.task input{margin-top:5px;transform:scale(1.2)}.progress{padding:14px;background:#f5f7fa;border-radius:10px;margin:16px 0}</style></head><body><header class="site-header"></header><main class="article-wrap"><article class="article checklist"><span class="badge">Yerleşim Aracı</span><h1>Almanya'ya Taşınma Kontrol Listesi</h1><p>İlk günlerde unutulması kolay işlemleri tek tek işaretleyin. Seçimleriniz bu tarayıcıda saklanır.</p><div id="progress" class="progress"></div><h2>İlk günler</h2><label class="task"><input type="checkbox" data-id="home"><span><strong>Konut ve teslim tutanağı</strong><br>Sayaç değerlerini ve anahtar teslimini belgeleyin.</span></label><label class="task"><input type="checkbox" data-id="anmeldung"><span><strong>Anmeldung</strong><br>Adres kaydı için randevu ve Wohnungsgeberbestätigung işlemini tamamlayın. <a href="/almanya-adres-kaydi-anmeldung/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="health"><span><strong>Sağlık sigortası</strong><br>GKV/PKV durumunuzu netleştirin. <a href="/saglik-sigortasi/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="bank"><span><strong>Banka hesabı</strong><br>Girokonto açın ve maaş/otomatik ödeme düzenini kurun. <a href="/almanyada-banka-hesabi/">Rehber</a></span></label><h2>İlk 2–4 hafta</h2><label class="task"><input type="checkbox" data-id="tax"><span><strong>Steuer-ID</strong><br>Vergi kimliğinizin ulaşmasını takip edin ve işvereninizle paylaşın.</span></label><label class="task"><input type="checkbox" data-id="internet"><span><strong>Telefon ve internet</strong><br>Adresteki DSL/Kabel/Glasfaser uygunluğunu kontrol edin. <a href="/telefon-internet/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="electric"><span><strong>Elektrik sözleşmesi</strong><br>Sayaç ve tedarikçi durumunu netleştirin. <a href="/almanyada-elektrik-aboneligi/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="radio"><span><strong>Rundfunkbeitrag</strong><br>Hanenin kayıt ve ödeme durumunu kontrol edin. <a href="/rundfunkbeitrag-nedir-nasil-odenir/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="insurance"><span><strong>Haftpflicht ihtiyacını değerlendirin</strong><br><a href="/haftpflichtversicherung/">Rehber</a></span></label><h2>Aile varsa</h2><label class="task"><input type="checkbox" data-id="kindergeld"><span><strong>Kindergeld</strong><br>Hak durumunu ve başvuruyu kontrol edin. <a href="/kindergeld/">Rehber</a></span></label><label class="task"><input type="checkbox" data-id="school"><span><strong>Kita/okul işlemleri</strong><br>Çocukların yerel kayıt ve yerleştirme süreçlerini başlatın.</span></label><button class="btn btn-secondary" onclick="resetList()" style="margin-top:18px">Listeyi sıfırla</button><p style="margin-top:20px"><a href="/yerlesim/">Yerleşim merkezi</a> · <a href="/araclar/">Tüm araçlar</a></p></article></main><footer class="footer"></footer><script>const boxes=[...document.querySelectorAll('[data-id]')],key='ap-moving-checklist-v1';function load(){const s=JSON.parse(localStorage.getItem(key)||'{}');boxes.forEach(b=>{b.checked=!!s[b.dataset.id];b.addEventListener('change',save)});render()}function save(){const s={};boxes.forEach(b=>s[b.dataset.id]=b.checked);localStorage.setItem(key,JSON.stringify(s));render()}function render(){const n=boxes.filter(b=>b.checked).length;document.getElementById('progress').innerHTML='<strong>'+n+' / '+boxes.length+' tamamlandı</strong><br>%'+Math.round(n/boxes.length*100)+' ilerleme'}function resetList(){localStorage.removeItem(key);boxes.forEach(b=>b.checked=false);render()}load()</script></body></html>
