name: Browser Privacy and CSP Audit

on:
  workflow_run:
    workflows: ["Deploy Almanya Pusulasi to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-privacy-csp
  cancel-in-progress: true

jobs:
  browser-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AP_BROWSER_CHANNEL: chrome
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.57.0 axe-core@4.13.0

      - name: Verify GitHub runner's preinstalled Chrome
        run: google-chrome --version

      - name: Audit live consent requests and CSP report-only in real Chromium
        env:
          AP_SITE_URL: https://almanyapusulasi.de
        run: node scripts/browser-privacy-csp.mjs

      - name: Audit accessibility and broader CSP sources in real Chromium
        env:
          AP_SITE_URL: https://almanyapusulasi.de
        run: node scripts/browser-accessibility-csp.mjs

      - name: Exercise real synthetic PDF and image OCR in Chrome
        env:
          AP_SITE_URL: https://almanyapusulasi.de
        run: node scripts/browser-ocr-csp.mjs

      - name: Verify affiliate placements and consent without contacting partners
        env:
          AP_SITE_URL: https://almanyapusulasi.de
        run: node scripts/browser-affiliate-csp.mjs

      - name: Upload sanitized partner privacy/CSP audit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-affiliate-csp
          path: audit-output/browser-affiliate-csp.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload sanitized synthetic OCR and CSP inventory
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-ocr-csp
          path: audit-output/browser-ocr-csp.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload sanitized accessibility and CSP inventory
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-accessibility-csp
          path: audit-output/browser-accessibility-csp.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload sanitized CSP and consent audit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-privacy-csp
          path: audit-output/browser-privacy-csp.json
          retention-days: 30
          if-no-files-found: warn
