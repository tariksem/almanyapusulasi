name: Browser Privacy and CSP Audit

on:
  workflow_run:
    workflows: ["Deploy Almanya Pusulasi to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-privacy-csp
  cancel-in-progress: true

jobs:
  browser-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.57.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Audit live consent requests and CSP report-only in real Chromium
        env:
          AP_SITE_URL: https://almanyapusulasi.de
        run: node scripts/browser-privacy-csp.mjs

      - name: Upload sanitized CSP and consent audit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-privacy-csp
          path: audit-output/browser-privacy-csp.json
          retention-days: 30
          if-no-files-found: warn
