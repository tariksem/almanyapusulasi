name: One-shot racism sitemap sync

on:
  push:
    branches: [main]
    paths: ['.racism-sitemap-trigger']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Irkcilik & Haklar URLs to sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          text=p.read_text(encoding='utf-8')
          urls=[
            ('https://almanyapusulasi.de/almanyada-irkcilik/','0.9'),
            ('https://almanyapusulasi.de/irkci-saldiriya-ugradim-ne-yapmaliyim/','0.9'),
            ('https://almanyapusulasi.de/irkcilik-olayini-belgeleme/','0.8'),
            ('https://almanyapusulasi.de/almanyada-irkcilik-ayrimcilik-nedir/','0.8'),
            ('https://almanyapusulasi.de/isyerinde-irkcilik-ayrimcilik/','0.8'),
            ('https://almanyapusulasi.de/okulda-irkcilik-cocuklar/','0.8'),
            ('https://almanyapusulasi.de/ev-kiralarken-irkcilik-ayrimcilik/','0.8'),
            ('https://almanyapusulasi.de/kamu-kurumunda-irkcilik-ayrimcilik/','0.8'),
            ('https://almanyapusulasi.de/internette-irkci-hakaret-tehdit/','0.8'),
            ('https://almanyapusulasi.de/irkcilik-ayrimcilik-yardim-destek/','0.9'),
          ]
          chunks=[]
          for url,priority in urls:
            if f'<loc>{url}</loc>' not in text:
              chunks.append(f'<url><loc>{url}</loc><priority>{priority}</priority></url>')
          if chunks:
            assert '</urlset>' in text
            text=text.replace('</urlset>',''.join(chunks)+'</urlset>',1)
            p.write_text(text,encoding='utf-8')
            print('Added',len(chunks),'URLs')
          else:
            print('All URLs already present')
          PY
      - name: Commit sitemap
        run: |
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "seo: add Irkcilik & Haklar pages to sitemap"
          git push
