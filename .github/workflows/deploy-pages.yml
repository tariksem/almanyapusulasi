name: Deploy Almanya Pusulasi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install social preview dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate social preview card
        run: python scripts/generate-social-preview.py
      - name: Enrich Open Graph and Twitter metadata
        run: python scripts/enhance-social-meta.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
