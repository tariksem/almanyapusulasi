name: Site Quality Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate audit regressions
        run: |
          node scripts/prepare-news-photos.js --download
          node scripts/generate-discovery.js
          node scripts/validate-news-editorial.js
          node scripts/validate-audit-fixes.js
          node scripts/validate-v42-cohesion.mjs
          node scripts/validate-home-hero-layout.js
          node scripts/validate-i18n-foundation.js
          node scripts/validate-localized-home.js
          node scripts/validate-2026-tools.js
          node scripts/validate-housing-tools.js
          node scripts/validate-nebenkosten-parser.js
          node scripts/validate-insurance-tools.js
          node scripts/validate-worker.mjs
          node scripts/validate-consent.js
          node scripts/validate-commercial-consent.js
      - name: Audit internal links, canonicals and SEO basics
        run: python3 scripts/validate-site-structure.py
      - name: Validate locked brand identity
        run: node scripts/validate-brand-lock.js
      - name: Validate direct Meta social automation
        run: |
          node scripts/validate-social-meta.js
          python -m py_compile scripts/render-social-queue.py scripts/publish-social-meta.py
      - name: Validate affiliate attribution configuration
        run: node scripts/validate-affiliate-attribution.js
      - name: Validate Umzug assistant rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/umzug-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate Miet budget rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/miet-budget-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate Elterngeld budget rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/elterngeld-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate Risikoleben need rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/risikoleben-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate credit-card intent rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/credit-card-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate finance revenue funnel
        run: node scripts/validate-finance-revenue-funnel.js
      - name: Validate acquisition P0
        run: node scripts/validate-acquisition-p0.js
      - name: Validate legacy 301 consolidations
        run: node scripts/validate-legacy-redirects.js
      - name: Validate sitemap structure
        run: node scripts/validate-sitemap-structure.js
      - name: Validate German letter templates
        run: |
          node - <<'JS'
          const core = require('./assets/js/letter-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate Auto-Kosten rules
        run: |
          node - <<'JS'
          const core = require('./assets/js/auto-cost-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
      - name: Validate Familienleistungen routing
        run: |
          node - <<'JS'
          const core = require('./assets/js/family-benefits-core.js');
          const result = core.runTests();
          for (const item of result.cases) console.log(`${item.ok ? 'PASS' : 'FAIL'} ${item.name}`);
          if (!result.pass) process.exit(1);
          JS
