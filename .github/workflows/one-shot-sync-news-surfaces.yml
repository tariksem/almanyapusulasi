name: One-shot sync news surfaces

on:
  push:
    branches: [main]
    paths:
      - '.news-sync-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync homepage news and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html')
          html = home.read_text(encoding='utf-8')
          replacement = '''<section class="section news-home"><div class="container"><div class="section-header news-home-head"><div><span class="section-label">Gündem</span><h2>Sizi gerçekten etkileyebilecek son gelişmeler</h2><p>Genel haber akışı değil; haklarınızı, ailenizi veya Almanya planınızı etkileyebilecek seçilmiş gelişmeler.</p></div><a class="btn btn-secondary" href="/haberler/">Tüm haberler →</a></div><div class="news-grid"><a class="news-card" href="/haberler/afd-saksonya-anhalt-secim-2026/"><div class="news-card-body"><div class="news-meta"><span class="news-tag">Toplum & Haklar</span><time datetime="2026-09-08">8 Eylül 2026</time></div><h3>AfD Saksonya-Anhalt'ta birinci oldu: Türkler için ne değişiyor?</h3><p>Seçim sonucu önemli bir siyasi değişim; ancak oturum ve vatandaşlık haklarında otomatik bir değişiklik yok.</p><span class="news-read">Ne değişti, ne değişmedi? →</span></div></a><a class="news-card" href="/haberler/pflege-yabanci-calisan-sinir-disi-riski-2026/"><div class="news-card-body"><div class="news-meta"><span class="news-tag">Göç & İş</span><time datetime="2026-09-08">8 Eylül 2026</time></div><h3>Pflege çalışanlarında sınır dışı riski: iş bulmak neden tek başına yetmiyor?</h3><p>Bakım sektöründeki personel açığına rağmen oturum ve iltica hukuku ayrı şartlara bağlı.</p><span class="news-read">Hukuki ayrımı gör →</span></div></a></div></div></section>'''
          new_html, count = re.subn(r'<section class="section news-home">.*?</section>', replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Homepage news block replacement count={count}')
          home.write_text(new_html, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          xml = sitemap.read_text(encoding='utf-8')
          urls = [
              'https://almanyapusulasi.de/haberler/afd-saksonya-anhalt-secim-2026/',
              'https://almanyapusulasi.de/haberler/pflege-yabanci-calisan-sinir-disi-riski-2026/',
              'https://almanyapusulasi.de/haberler/strom-netzentgelte-2027/',
              'https://almanyapusulasi.de/haberler/krankenkasse-zusatzbeitrag-2027/',
              'https://almanyapusulasi.de/haberler/vergi-kindergeld-2027/',
          ]
          anchor = '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          additions = ''.join(f'<url><loc>{u}</loc><priority>0.9</priority></url>' for u in urls if f'<loc>{u}</loc>' not in xml)
          if additions:
              if anchor not in xml:
                  raise SystemExit('Sitemap urlset anchor not found')
              xml = xml.replace(anchor, anchor + additions, 1)
              sitemap.write_text(xml, encoding='utf-8')
          print('Homepage news block synced; sitemap additions:', additions.count('<url>'))
          PY
      - name: Commit synced surfaces
        run: |
          git config user.name 'almanyapusulasi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'news: sync homepage highlights and sitemap'
          git push origin HEAD:main
