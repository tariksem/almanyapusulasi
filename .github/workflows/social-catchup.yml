name: One-time Social Catch-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-catchup.yml'

permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate brand lock
        run: node scripts/validate-brand-lock.js
      - name: Validate social queue
        run: node scripts/validate-social-meta.js
      - name: Publish missed 20 Sep post with duplicate guards
        env:
          META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish-social-meta.py --date 2026-09-20
